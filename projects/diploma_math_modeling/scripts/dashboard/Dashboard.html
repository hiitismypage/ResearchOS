<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<title>Двухуровневая модель межотраслевого баланса — Симуляция</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root {
    --bg: #fafafa;
    --panel: #ffffff;
    --ink: #1a1a1a;
    --ink-2: #555;
    --ink-3: #888;
    --line: #e6e6e6;
    --line-2: #ededed;
    --accent: #2b4f81;
    --accent-hover: #1f3c64;
    --warning: #c08a2e;
    --warning-bg: #fdf6e5;
    --c1: #1f77b4; /* синий — Добыча */
    --c2: #ff7f0e; /* оранжевый — Энергетика */
    --c3: #2ca02c; /* зелёный — Обработка */
    --c4: #d62728; /* красный — Строительство */
    --c5: #9467bd; /* фиолетовый — С/х */
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
  #root { min-height: 100vh; }
  .app {
    display: grid;
    grid-template-columns: 340px 1fr;
    min-height: 100vh;
  }
  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    max-height: 100vh;
    position: sticky; top: 0;
  }
  .sidebar-head {
    padding: 22px 24px 16px;
    border-bottom: 1px solid var(--line);
  }
  .sidebar-head h1 { margin: 0 0 2px; font-size: 16px; font-weight: 600; line-height: 1.35; }
  .sidebar-head .sub { font-size: 12px; color: var(--ink-2); }
  .sidebar-body { padding: 18px 24px 18px; overflow-y: auto; flex: 1; }
  .section-title { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--ink-3); margin: 4px 0 14px; font-weight: 600; }

  .field { margin-bottom: 18px; }
  .field-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px; }
  .field-label { font-size: 13px; color: var(--ink); display: flex; gap: 6px; align-items: baseline; }
  .field-label .sym { font-family: "STIX Two Math", "Times New Roman", Georgia, serif; font-style: italic; font-size: 15px; line-height: 1; display: inline-flex; align-items: baseline; }
  .field-label .sym .sub { font-size: 0.72em; line-height: 0; position: relative; bottom: -0.28em; margin-left: 0.5px; font-style: italic; color: var(--ink-2); }
  .field-value { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
  .field-help { font-size: 11px; color: var(--ink-3); margin-top: 4px; }

  /* slider */
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 18px; background: transparent; cursor: pointer;
    margin: 0;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 2px; background: var(--line); border-radius: 1px;
  }
  input[type=range]::-moz-range-track {
    height: 2px; background: var(--line); border-radius: 1px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff; border: 1.5px solid var(--accent);
    margin-top: -6px;
    box-shadow: 0 1px 2px rgba(0,0,0,.08);
    transition: transform .08s ease;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.12); }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: #fff; border: 1.5px solid var(--accent);
    box-shadow: 0 1px 2px rgba(0,0,0,.08);
  }

  /* accordion */
  .accordion { border-top: 1px solid var(--line); margin-top: 10px; }
  .accordion-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 0 12px; cursor: pointer; user-select: none;
  }
  .accordion-head .left { display: flex; align-items: center; gap: 8px; }
  .accordion-head h3 { margin: 0; font-size: 13px; font-weight: 600; }
  .accordion-head .chev { width: 10px; height: 10px; border-right: 1.5px solid var(--ink-2); border-bottom: 1.5px solid var(--ink-2);
    transform: rotate(-45deg); transition: transform .18s ease; margin-right: 3px; }
  .accordion.open .chev { transform: rotate(45deg); }
  .accordion-body { padding: 4px 0 6px; }

  .sector-row { display: grid; grid-template-columns: 12px 1fr 38px; gap: 10px; align-items: center; padding: 7px 0; }
  .sector-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .sector-name { font-size: 12px; color: var(--ink); }
  .sector-val { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px; color: var(--ink-2); text-align: right; font-variant-numeric: tabular-nums; }
  .sector-slider { grid-column: 1 / -1; padding: 0 0 2px; }
  .sector-name-input {
    background: transparent; border: 1px solid transparent; border-bottom: 1px dashed var(--line);
    font: inherit; font-size: 12px; color: var(--ink);
    padding: 2px 4px; width: 100%; border-radius: 2px;
    transition: border-color .12s, background .12s;
  }
  .sector-name-input:hover { border-bottom-color: var(--ink-3); }
  .sector-name-input:focus { outline: none; border: 1px solid var(--accent); background: #fff; }
  .sector-count-row { display: flex; align-items: center; gap: 8px; padding: 4px 0 12px; }
  .stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .stepper button {
    width: 26px; height: 26px; border: 0; background: #fff; cursor: pointer;
    font-size: 15px; color: var(--ink-2); line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .stepper button:hover:not(:disabled) { background: #f5f5f5; color: var(--ink); }
  .stepper button:disabled { color: var(--line); cursor: not-allowed; }
  .stepper .val { padding: 0 10px; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; font-variant-numeric: tabular-nums; min-width: 22px; text-align: center; border-left: 1px solid var(--line); border-right: 1px solid var(--line); height: 26px; display: flex; align-items: center; justify-content: center; }

  /* run button area */
  .sidebar-foot { padding: 16px 24px 22px; border-top: 1px solid var(--line); background: var(--panel); }
  .dirty-indicator {
    display: flex; align-items: center; gap: 8px;
    background: var(--warning-bg);
    color: #6a4a14;
    border: 1px solid #f1e2bf;
    border-radius: 4px;
    padding: 7px 10px;
    font-size: 12px;
    margin-bottom: 10px;
  }
  .dirty-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--warning); flex-shrink: 0; }
  .run-btn {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: 0;
    border-radius: 4px;
    padding: 12px 14px;
    font: inherit;
    font-weight: 600;
    font-size: 13.5px;
    cursor: pointer;
    letter-spacing: 0.01em;
    transition: background .15s ease, transform .05s ease, box-shadow .15s ease;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .run-btn:hover { background: var(--accent-hover); }
  .run-btn:active { transform: translateY(1px); }
  .run-btn.dirty {
    box-shadow: 0 0 0 3px rgba(43, 79, 129, 0.18);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .run-btn:disabled { opacity: 0.7; cursor: progress; }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(43, 79, 129, 0.0); }
    50% { box-shadow: 0 0 0 4px rgba(43, 79, 129, 0.18); }
  }
  .spinner {
    width: 14px; height: 14px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.35); border-top-color: #fff;
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* main area */
  .main { padding: 22px 26px 28px; min-width: 0; }
  .main-head { margin-bottom: 18px; }
  .main-title { font-size: 18px; font-weight: 600; margin: 0; }
  .main-sub { font-size: 12px; color: var(--ink-2); margin-top: 3px; }
  .param-chips { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 10px; }
  .param-chip {
    display: inline-flex; align-items: baseline; justify-content: center; gap: 7px;
    background: #fff; border: 1px solid var(--line);
    border-radius: 3px; padding: 5px 11px 4px;
    font-size: 13px;
    font-variant-numeric: tabular-nums;
  }
  .param-chip .k {
    color: var(--ink);
    font-family: "STIX Two Math", "Times New Roman", Georgia, serif;
    font-style: italic;
    line-height: 1;
    display: inline-flex; align-items: baseline;
  }
  .param-chip .k .sub {
    font-size: 0.72em;
    line-height: 0;
    position: relative;
    bottom: -0.28em;
    margin-left: 0.5px;
    font-style: italic;
    color: var(--ink-2);
  }
  .param-chip .eq {
    color: var(--ink-3);
    font-family: "STIX Two Math", "Times New Roman", Georgia, serif;
    font-style: italic;
    margin: 0 -1px;
  }
  .param-chip .v {
    color: var(--ink);
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 11.5px;
  }
  .param-chip.muted { background: #fafafa; }
  .param-chip.muted .v { color: var(--ink-3); }
  .param-chip.muted .k { color: var(--ink-3); }
  .param-chip.muted .k .sub { color: var(--ink-3); }

  .charts {
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto;
    gap: 16px;
  }
  .chart-card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 16px 18px 12px;
    display: flex; flex-direction: column;
    min-width: 0;
  }
  .chart-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 4px; gap: 8px; }
  .chart-head-text { flex: 1; min-width: 0; }
  .chart-title { font-size: 13px; font-weight: 600; margin: 0; }
  .chart-sub { font-size: 11px; color: var(--ink-3); }
  .expand-btn {
    background: transparent; border: 1px solid transparent;
    width: 24px; height: 24px; border-radius: 3px;
    cursor: pointer; color: var(--ink-3);
    display: flex; align-items: center; justify-content: center;
    transition: background .12s, color .12s, border-color .12s;
    flex-shrink: 0;
  }
  .expand-btn:hover { background: #f3f3f5; color: var(--ink); border-color: var(--line); }
  .expand-btn svg { width: 12px; height: 12px; }

  /* fullscreen modal */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(20, 22, 28, 0.55);
    backdrop-filter: blur(2px);
    z-index: 100;
    display: flex; align-items: center; justify-content: center;
    padding: 36px;
    animation: fadeIn .14s ease;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: #fff; border-radius: 6px;
    width: 100%; max-width: 1280px; max-height: calc(100vh - 72px);
    display: flex; flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,.18);
    overflow: hidden;
    animation: modalIn .18s cubic-bezier(.2,.7,.3,1);
  }
  @keyframes modalIn { from { transform: translateY(10px) scale(.985); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 22px; border-bottom: 1px solid var(--line);
  }
  .modal-head h3 { margin: 0; font-size: 15px; font-weight: 600; }
  .modal-head .sub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .modal-close {
    background: transparent; border: 1px solid var(--line);
    width: 30px; height: 30px; border-radius: 4px;
    cursor: pointer; color: var(--ink-2);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px;
  }
  .modal-close:hover { background: #f5f5f5; color: var(--ink); }
  .modal-body { padding: 22px 26px 24px; flex: 1; overflow: auto; display: flex; flex-direction: column; }
  .modal-body .chart-svg-wrap { flex: 1; }
  .chart-legend {
    display: flex; flex-wrap: wrap; gap: 12px 14px;
    margin-top: 8px;
    font-size: 11px; color: var(--ink-2);
  }
  .chart-legend .li { display: flex; align-items: center; gap: 6px; }
  .chart-legend .sw { width: 12px; height: 2px; }

  .chart-svg-wrap { position: relative; }
  .chart-svg { width: 100%; display: block; }

  .placeholder-overlay {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(250,250,250,0.7);
    backdrop-filter: blur(1px);
    pointer-events: none;
    border-radius: 2px;
  }
  .placeholder-overlay .msg {
    background: #fff; border: 1px solid var(--line);
    padding: 8px 14px; border-radius: 3px;
    font-size: 12px; color: var(--ink-2);
    box-shadow: 0 1px 3px rgba(0,0,0,.04);
  }

  .kpi-row {
    margin-top: 16px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 16px 20px;
  }
  .kpi { display: flex; flex-direction: column; gap: 4px; }
  .kpi .k { font-size: 11px; color: var(--ink-3); letter-spacing: 0.04em; text-transform: uppercase; }
  .kpi .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; }
  .kpi .u { font-size: 11px; color: var(--ink-3); }
  .kpi.muted .v { color: var(--ink-3); }

  /* tooltip on hover */
  .tooltip {
    position: absolute; pointer-events: none;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 6px 9px;
    font-size: 11px;
    box-shadow: 0 4px 12px rgba(0,0,0,.06);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    transform: translate(-50%, -100%);
    z-index: 5;
  }
  .tooltip .ttitle { font-size: 10px; color: var(--ink-3); margin-bottom: 3px; }
  .tooltip .trow { display: flex; align-items: center; gap: 6px; }
  .tooltip .trow .sw { width: 8px; height: 8px; border-radius: 50%; }
  .tooltip .trow .name { color: var(--ink-2); }
  .tooltip .trow .val { color: var(--ink); margin-left: auto; font-weight: 500; }
  .tooltip .trow .name { min-width: 90px; }

  /* info icon + tooltip */
  .info-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 13px; height: 13px;
    color: var(--ink-3);
    cursor: help; user-select: none;
    margin-left: 3px; flex-shrink: 0;
    position: relative;
    transition: color .12s;
  }
  .info-icon:hover, .info-icon:focus { color: var(--ink); outline: none; }
  .info-icon svg { display: block; }
  .info-tip {
    position: fixed;
    background: #1a1a1a; color: #fff;
    border-radius: 4px; padding: 8px 11px;
    font-size: 11px; line-height: 1.45;
    font-style: normal; font-weight: 400;
    font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    width: 220px;
    text-align: left; white-space: normal;
    pointer-events: none;
    z-index: 1000;
    box-shadow: 0 4px 14px rgba(0,0,0,.18);
  }
  .info-tip::after {
    content: ""; position: absolute;
    left: var(--arrow-left, 50%);
    transform: translateX(-50%);
    border: 5px solid transparent;
  }
  .info-tip.top::after { top: 100%; border-top-color: #1a1a1a; }
  .info-tip.bottom::after { bottom: 100%; border-bottom-color: #1a1a1a; }

  /* per-sector dual-slider rows for accordions 1 & 2 */
  .sector-block { padding: 9px 0 11px; border-top: 1px dashed var(--line-2); }
  .sector-block:first-of-type { border-top: 0; padding-top: 4px; }
  .sector-block-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .sector-block-name { font-size: 12px; color: var(--ink); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dual-sliders { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .mini-slider { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .mini-head { display: flex; justify-content: space-between; align-items: baseline; gap: 4px; }
  .mini-label {
    font-size: 11px; color: var(--ink-2);
    display: inline-flex; align-items: baseline; gap: 2px;
  }
  .mini-label .sym {
    font-family: "STIX Two Math", "Times New Roman", Georgia, serif;
    font-style: italic; font-size: 12.5px; line-height: 1;
    display: inline-flex; align-items: baseline;
  }
  .mini-label .sym .sub {
    font-size: 0.72em; line-height: 0; position: relative;
    bottom: -0.28em; margin-left: 0.5px; font-style: italic; color: var(--ink-3);
  }
  .mini-val {
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 10.5px; color: var(--ink-2); font-variant-numeric: tabular-nums;
  }

  /* integer input for section 3 */
  .int-input {
    width: 64px; padding: 4px 8px;
    border: 1px solid var(--line); border-radius: 3px;
    font: inherit; font-size: 12.5px;
    font-family: "SF Mono", Menlo, Consolas, monospace;
    font-variant-numeric: tabular-nums;
    text-align: center;
    background: #fff;
    transition: border-color .12s, background .12s;
  }
  .int-input:focus { outline: none; border-color: var(--accent); }
  .int-input.err { border-color: #c0392b; background: #fdf0ef; }
  .int-input::-webkit-outer-spin-button,
  .int-input::-webkit-inner-spin-button {
    -webkit-appearance: auto; opacity: 0.6;
  }
  .hhi-hint { font-size: 10.5px; color: var(--ink-3); margin-top: 4px; padding-left: 20px;
    font-family: "SF Mono", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }

  /* small text helpers */
  .tag { display: inline-block; background: #f1f3f6; color: var(--ink-2);
    border-radius: 2px; padding: 1px 6px; font-size: 10.5px;
    font-family: "SF Mono", Menlo, Consolas, monospace; }

  @media (max-width: 1100px) {
    .charts { grid-template-columns: 1fr; }
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; }
    .sidebar { position: static; max-height: none; min-height: 0; }
  }
</style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="env,react">
  const { useState, useEffect, useMemo, useRef } = React;

  /* ---------------- Sectors & palette ---------------- */
  // Matplotlib tab10 palette, extended
  const PALETTE = ['#1f77b4', '#ff7f0e', '#2ca02c', '#d62728', '#9467bd', '#8c564b', '#e377c2', '#7f7f7f'];
  const DEFAULT_SECTOR_NAMES = ['Добыча', 'Энергетика', 'Обрабатывающая пром.', 'Строительство', 'Сельское хозяйство', 'Транспорт', 'Услуги', 'ИКТ'];
  const DEFAULT_KAPPA_ALL  = [0.30,  0.05,  0.45,  0.20,  0.15,  0.25,  0.20,  0.30];
  const DEFAULT_ETA_ALL    = [0.010, 0.005, 0.015, 0.015, 0.010, 0.010, 0.010, 0.010];
  const DEFAULT_P_INN_ALL  = [0.10,  0.05,  0.18,  0.12,  0.15,  0.10,  0.10,  0.10];
  const DEFAULT_MU_ALL     = [0.022, 0.022, 0.027, 0.024, 0.023, 0.022, 0.022, 0.022];
  const DEFAULT_NJ_ALL     = [32,    27,    41,    25,    34,    20,    20,    20];
  const MIN_SECTORS = 2;
  const MAX_SECTORS = 8;

  // Info tooltips per parameter
  const INFO = {
    T:      'Горизонт прогнозирования. Каждый шаг = 1 год. При T=30 модель считает 2015–2045.',
    gU:     'Ежегодный темп роста экзогенного конечного спроса u(t). Не зависит от инвестиционного механизма — задаётся извне.',
    sigmaK: 'Параметр формы лог-нормального распределения начального капитала фирм. Чем выше — тем сильнее начальная неоднородность фирм по размеру.',
    bClip:  'Верхний предел матрицы капиталоёмкости B(t) в единицах B(0). Ограничивает скачки целевого выпуска в периоды медленного роста. Влияет на число инвестиционных пульсов.',
    kappa:  'Доля чистой прибыли, которую фирма реинвестирует в расширение. Высокое κ → быстрый рост при наличии прибыли.',
    eta:    'Коэффициент инвестирования при дефиците мощностей. Определяет, как активно фирма закрывает разрыв между спросом и производственной мощностью.',
    pInn:   'Вероятность инновационного шока в каждом периоде. При шоке технологические коэффициенты фирмы снижаются — производство становится эффективнее.',
    mu:     'Ожидаемая доля снижения коэффициентов прямых затрат при инновационном шоке. Чем выше — тем сильнее каждый шок снижает ресурсоёмкость.',
    Nj:     'Число фирм-агентов в отрасли. Определяет детализацию микродинамики. Теоретический минимум HHI при равных долях = 1/N.',
  };

  function makeSectors(count, names) {
    return Array.from({ length: count }, (_, i) => ({
      id: 's' + i,
      name: (names && names[i]) || DEFAULT_SECTOR_NAMES[i] || ('Отрасль ' + (i + 1)),
      color: PALETTE[i % PALETTE.length],
    }));
  }

  /* ---------------- PRNG (deterministic) ---------------- */
  function hash(seed) {
    let h = 2166136261 >>> 0;
    const s = String(seed);
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return h >>> 0;
  }
  function mulberry32(a) {
    return function() {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
  }

  /* ---------------- Simulation (plausible synthetic) ---------------- */

  // ── Real API call (replaces mock runSimulation) ──────────────────────────
  async function fetchSimulation(params, sectors) {
    const resp = await fetch('/api/simulate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ params, sectors }),
    });
    if (!resp.ok) throw new Error('API ' + resp.status);
    return resp.json();  // { years, output, rho, investment, hhi, kpi }
  }


  /* ---------------- Chart primitives ---------------- */
  const CHART_W = 460;
  const CHART_H = 240;
  const PAD = { l: 44, r: 14, t: 10, b: 28 };

  function niceTicks(min, max, count = 5) {
    const range = max - min;
    if (range === 0) return [min];
    const step0 = range / count;
    const mag = Math.pow(10, Math.floor(Math.log10(step0)));
    const norm = step0 / mag;
    let step;
    if (norm < 1.5) step = 1 * mag;
    else if (norm < 3) step = 2 * mag;
    else if (norm < 7) step = 5 * mag;
    else step = 10 * mag;
    const start = Math.ceil(min / step) * step;
    const ticks = [];
    for (let v = start; v <= max + 1e-9; v += step) ticks.push(+v.toFixed(10));
    return ticks;
  }
  function fmt(v, digits = 2) {
    if (v === null || v === undefined || isNaN(v)) return '—';
    if (Math.abs(v) >= 1000) return v.toLocaleString('ru-RU', { maximumFractionDigits: 0 });
    return v.toLocaleString('ru-RU', { maximumFractionDigits: digits, minimumFractionDigits: digits });
  }

  function LineChart({ title, subtitle, series, xs, yLabel, xLabel,
                      yMin, yMax, refLines = [], placeholder, showLegend = true,
                      xFmt = (v) => v, yFmt = (v) => fmt(v, 2),
                      tooltipYFmt, onExpand, large = false }) {
    const [hoverIdx, setHoverIdx] = useState(null);
    const svgRef = useRef(null);

    const W = large ? 1100 : CHART_W;
    const H = large ? 540 : CHART_H;
    const padL = large ? 64 : PAD.l;
    const padR = large ? 20 : PAD.r;
    const padT = large ? 18 : PAD.t;
    const padB = large ? 40 : PAD.b;
    const innerW = W - padL - padR;
    const innerH = H - padT - padB;
    const fontBase = large ? 13 : 10;

    const yLo = yMin !== undefined ? yMin : Math.min(...series.flatMap(s => s.data));
    const yHi = yMax !== undefined ? yMax : Math.max(...series.flatMap(s => s.data));
    const yPad = (yHi - yLo) * 0.06;
    const Y0 = yLo - yPad, Y1 = yHi + yPad;

    const xLo = xs[0], xHi = xs[xs.length - 1];
    const xScale = (x) => padL + ((x - xLo) / (xHi - xLo)) * innerW;
    const yScale = (y) => padT + (1 - (y - Y0) / (Y1 - Y0)) * innerH;

    const yTicks = niceTicks(Y0, Y1, 5);
    const xTicks = useMemo(() => {
      const span = xHi - xLo;
      let step = 5;
      if (span <= 12) step = 2;
      else if (span <= 25) step = 5;
      else if (span <= 60) step = 10;
      else step = 20;
      const t = [];
      const startX = Math.ceil(xLo / step) * step;
      for (let v = startX; v <= xHi; v += step) t.push(v);
      if (t[0] !== xLo) t.unshift(xLo);
      if (t[t.length - 1] !== xHi) t.push(xHi);
      return t;
    }, [xLo, xHi]);

    function path(data) {
      let d = '';
      for (let i = 0; i < data.length; i++) {
        const x = xScale(xs[i]), y = yScale(data[i]);
        d += (i === 0 ? 'M' : 'L') + x.toFixed(2) + ',' + y.toFixed(2);
      }
      return d;
    }

    function onMove(e) {
      const rect = svgRef.current.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (W / rect.width);
      if (x < padL || x > W - padR) { setHoverIdx(null); return; }
      const xVal = xLo + ((x - padL) / innerW) * (xHi - xLo);
      let best = 0, bd = Infinity;
      for (let i = 0; i < xs.length; i++) {
        const d = Math.abs(xs[i] - xVal);
        if (d < bd) { bd = d; best = i; }
      }
      setHoverIdx(best);
    }

    const fmtY = tooltipYFmt || yFmt;

    return (
      <div className="chart-card">
        <div className="chart-head">
          <div className="chart-head-text">
            <h3 className="chart-title">{title}</h3>
            {subtitle && <div className="chart-sub">{subtitle}</div>}
          </div>
          {onExpand && (
            <button className="expand-btn" onClick={onExpand} title="Открыть на весь экран" aria-label="Развернуть">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round">
                <path d="M9 2h5v5M2 9v5h5M14 2L9 7M2 14l5-5" />
              </svg>
            </button>
          )}
        </div>
        <div className="chart-svg-wrap">
          <svg
            ref={svgRef}
            className="chart-svg"
            viewBox={`0 0 ${W} ${H}`}
            preserveAspectRatio="xMidYMid meet"
            onMouseMove={placeholder ? undefined : onMove}
            onMouseLeave={() => setHoverIdx(null)}
          >
            {/* y grid + labels */}
            {yTicks.map((t, i) => (
              <g key={'y'+i}>
                <line x1={padL} x2={W - padR} y1={yScale(t)} y2={yScale(t)} stroke="#eee" />
                <text x={padL - 8} y={yScale(t) + 3.5} textAnchor="end"
                  fontSize={fontBase} fill="#888" fontFamily="-apple-system, sans-serif">
                  {yFmt(t)}
                </text>
              </g>
            ))}
            {/* x ticks */}
            {xTicks.map((t, i) => (
              <g key={'x'+i}>
                <line x1={xScale(t)} x2={xScale(t)} y1={H - padB} y2={H - padB + 3} stroke="#bbb" />
                <text x={xScale(t)} y={H - padB + 14} textAnchor="middle"
                  fontSize={fontBase} fill="#888" fontFamily="-apple-system, sans-serif">
                  {xFmt(t)}
                </text>
              </g>
            ))}
            {/* axes */}
            <line x1={padL} x2={W - padR} y1={H - padB} y2={H - padB} stroke="#aaa" strokeWidth="1" />
            <line x1={padL} x2={padL} y1={padT} y2={H - padB} stroke="#aaa" strokeWidth="1" />

            {/* reference lines */}
            {refLines.map((r, i) => (
              <g key={'ref'+i}>
                <line x1={padL} x2={W - padR}
                  y1={yScale(r.y)} y2={yScale(r.y)}
                  stroke={r.color || '#c33'} strokeWidth="1"
                  strokeDasharray="4 3" />
                {r.label && (
                  <text x={W - padR - 4} y={yScale(r.y) - 4} textAnchor="end"
                    fontSize={fontBase} fill={r.color || '#c33'} fontFamily="-apple-system, sans-serif">
                    {r.label}
                  </text>
                )}
              </g>
            ))}

            {/* series */}
            {series.map((s, i) => (
              <path key={'s'+i} d={path(s.data)} fill="none"
                stroke={s.color} strokeWidth={s.width || (large ? 2 : 1.6)}
                strokeLinejoin="round" strokeLinecap="round"
                opacity={placeholder ? 0.35 : 1} />
            ))}

            {/* hover marker */}
            {hoverIdx !== null && !placeholder && (
              <g>
                <line x1={xScale(xs[hoverIdx])} x2={xScale(xs[hoverIdx])}
                  y1={padT} y2={H - padB} stroke="#ccc" strokeDasharray="3 3" />
                {series.map((s, i) => (
                  <circle key={'d'+i} cx={xScale(xs[hoverIdx])} cy={yScale(s.data[hoverIdx])}
                    r={large ? 4 : 3} fill="#fff" stroke={s.color} strokeWidth="1.5" />
                ))}
              </g>
            )}

            {/* y label */}
            {yLabel && (
              <text x={large ? 18 : 12} y={padT + innerH / 2} fontSize={fontBase} fill="#888"
                textAnchor="middle"
                fontFamily="-apple-system, sans-serif"
                transform={`rotate(-90, ${large ? 18 : 12}, ${padT + innerH / 2})`}>
                {yLabel}
              </text>
            )}
            {xLabel && (
              <text x={padL + innerW / 2} y={H - 3} fontSize={fontBase} fill="#888"
                textAnchor="middle" fontFamily="-apple-system, sans-serif">
                {xLabel}
              </text>
            )}
          </svg>

          {hoverIdx !== null && !placeholder && (
            <div className="tooltip" style={{
              left: `${(xScale(xs[hoverIdx]) / W) * 100}%`,
              top: `${(padT / H) * 100}%`,
            }}>
              <div className="ttitle">{xFmt(xs[hoverIdx])}</div>
              {series.map((s, i) => (
                <div className="trow" key={'tt'+i}>
                  <span className="sw" style={{ background: s.color }}></span>
                  <span className="name">{s.label}</span>
                  <span className="val">{fmtY(s.data[hoverIdx])}</span>
                </div>
              ))}
            </div>
          )}

          {placeholder && (
            <div className="placeholder-overlay">
              <div className="msg">Нажмите «Запустить» для расчёта</div>
            </div>
          )}
        </div>

        {showLegend && (
          <div className="chart-legend">
            {series.map((s, i) => (
              <div className="li" key={i}>
                <span className="sw" style={{ background: s.color }}></span>
                <span>{s.label}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  /* ---------------- Sidebar controls ---------------- */
  function Slider({ value, min, max, step, onChange, fmt }) {

          onChange={(e) => onChange(parseFloat(e.target.value))} />

  function Field({ label, sym, value, valueStr, min, max, step, onChange, help, info }) {

  function InfoTip({ text }) {
    const [anchor, setAnchor] = useState(null); // icon rect when shown
    const [placement, setPlacement] = useState({ top: 0, left: 0, side: 'top', arrowLeft: '50%' });
    const iconRef = useRef(null);
    const tipRef = useRef(null);

    function show() {
      if (!iconRef.current) return;
      setAnchor(iconRef.current.getBoundingClientRect());
    }
    function hide() { setAnchor(null); }

    // Re-measure & place after the tip is in the DOM
    useEffect(() => {
      if (!anchor || !tipRef.current) return;
      const tip = tipRef.current.getBoundingClientRect();
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const GAP = 8;
      const MARGIN = 6;

      // Decide side: prefer top, fall back to bottom
      let side = 'top';
      let top = anchor.top - tip.height - GAP;
      if (top < MARGIN) {
        side = 'bottom';
        top = anchor.bottom + GAP;
      }

      // Horizontal: center on icon, clamp to viewport
      const iconCenter = anchor.left + anchor.width / 2;
      let left = iconCenter - tip.width / 2;
      left = Math.max(MARGIN, Math.min(left, vw - tip.width - MARGIN));
      const arrowLeft = Math.max(8, Math.min(tip.width - 8, iconCenter - left)) + 'px';

      setPlacement({ top, left, side, arrowLeft });
    }, [anchor, text]);

    // Hide on scroll/resize — the fixed tip would otherwise stay anchored at stale coords
    useEffect(() => {
      if (!anchor) return;
      function onScroll() { setAnchor(null); }
      window.addEventListener('scroll', onScroll, true);
      window.addEventListener('resize', onScroll);
      return () => {
        window.removeEventListener('scroll', onScroll, true);
        window.removeEventListener('resize', onScroll);
      };
    }, [anchor]);

    return (
      <span
        ref={iconRef}
        className="info-icon"
        tabIndex="0"
        role="img"
        aria-label="Подсказка"
        onMouseEnter={show}
        onMouseLeave={hide}
        onFocus={show}
        onBlur={hide}
      >
        <svg viewBox="0 0 14 14" width="13" height="13" fill="none" stroke="currentColor" strokeWidth="1">
          <circle cx="7" cy="7" r="6" />
          <line x1="7" y1="6" x2="7" y2="10.5" strokeWidth="1.2" strokeLinecap="round" />
          <circle cx="7" cy="4" r="0.7" fill="currentColor" stroke="none" />
        </svg>
        {anchor && ReactDOM.createPortal(
          <span
            ref={tipRef}
            className={`info-tip ${placement.side}`}
            style={{ left: placement.left, top: placement.top, '--arrow-left': placement.arrowLeft }}
          >
            {text}
          </span>,
          document.body
        )}
      </span>
    );
  }

  /* ---------------- Main app ---------------- */
  function App() {

    const [sectorNames, setSectorNames] = useState(DEFAULT_SECTOR_NAMES.slice(0, 8));

    const sectors = useMemo(
      () => makeSectors(sectorCount, sectorNames),
      [sectorCount, sectorNames]
    );

    const [params, setParams] = useState({
      T: 30,
      gU: 0.015,
      sigmaK: 0.6,
      bClip: 5,
      kappa: DEFAULT_KAPPA_ALL.slice(0, 5),
      eta:   DEFAULT_ETA_ALL.slice(0, 5),
      pInn:  DEFAULT_P_INN_ALL.slice(0, 5),
      mu:    DEFAULT_MU_ALL.slice(0, 5),
      Nj:    DEFAULT_NJ_ALL.slice(0, 5),
    });
    const [accordionsOpen, setAccordionsOpen] = useState({ inv: false, tech: false, agents: false });
    function toggleAcc(k) { setAccordionsOpen(o => ({ ...o, [k]: !o[k] })); }
    const [running, setRunning] = useState(false);
    const [results, setResults] = useState(null);
    const [appliedParams, setAppliedParams] = useState(null);
    const [appliedSectors, setAppliedSectors] = useState(null);
    const [fullscreenIdx, setFullscreenIdx] = useState(null);

    // Keep all per-sector arrays in sync with sectorCount
    useEffect(() => {
      setParams(p => {
        if (p.kappa.length === sectorCount && p.eta.length === sectorCount) return p;
        const extend = (arr, defaults, fallback) => {
          let a = arr.slice(0, sectorCount);
          while (a.length < sectorCount) a.push(defaults[a.length] ?? fallback);
          return a;
        };
        return {
          ...p,
          kappa: extend(p.kappa, DEFAULT_KAPPA_ALL, 0.20),
          eta:   extend(p.eta,   DEFAULT_ETA_ALL,   0.010),
          pInn:  extend(p.pInn,  DEFAULT_P_INN_ALL, 0.10),
          mu:    extend(p.mu,    DEFAULT_MU_ALL,    0.022),
          Nj:    extend(p.Nj,    DEFAULT_NJ_ALL,    20),
        };
      });
    }, [sectorCount]);

    // dirty = current params/sectors differ from those of last run
    const dirty = useMemo(() => {
      if (!appliedParams) return false;
      const samp = JSON.stringify({ p: params, s: sectors.map(x => x.name) });
      const sap = JSON.stringify({ p: appliedParams, s: appliedSectors?.map(x => x.name) });
      return samp !== sap;
    }, [params, sectors, appliedParams, appliedSectors]);

    function update(k, v) {
      setParams(p => ({ ...p, [k]: v }));
    }
    function updateArr(key, i, v) {
      setParams(p => {
        const a = [...p[key]]; a[i] = v;
        return { ...p, [key]: a };
      });
    }
    function updateKappa(i, v) { updateArr('kappa', i, v); }
    function updateSectorName(i, name) {
      setSectorNames(prev => {
        const arr = [...prev];
        arr[i] = name;
        return arr;
      });
    }
    function incSectors() { setSectorCount(c => Math.min(MAX_SECTORS, c + 1)); }
    function decSectors() { setSectorCount(c => Math.max(MIN_SECTORS, c - 1)); }

    async function run() {
      setRunning(true);
      try {
        const r = await fetchSimulation(params, sectors);
        setResults(r);
        setAppliedParams(JSON.parse(JSON.stringify(params)));
        setAppliedSectors(sectors.map(s => ({ ...s })));
      } catch (e) {
        console.error('Ошибка симуляции:', e);
      } finally {
        setRunning(false);
      }

            <Field
              label="Ограничение матрицы B"
              sym={<>B<span className="sub">clip</span></>}
              value={params.bClip}
              valueStr={params.bClip.toFixed(1)}
              min={2} max={10} step={0.5}
              onChange={(v) => update('bClip', +v.toFixed(1))}
              help="Верхняя граница капиталоёмкости b_ij"
              info={INFO.bClip}
            />

            {/* === Отрасли: количество и названия === */}
            <div className="section-title" style={{marginTop: 22}}>Отрасли</div>
            <div className="sector-count-row" style={{padding: '0 0 10px'}}>
              <span style={{fontSize: 12, color: 'var(--ink-2)'}}>Количество отраслей</span>
              <div className="stepper" style={{marginLeft: 'auto'}}>
                <button onClick={decSectors} disabled={sectorCount <= MIN_SECTORS} aria-label="Убрать">−</button>
                <span className="val">{sectorCount}</span>
                <button onClick={incSectors} disabled={sectorCount >= MAX_SECTORS} aria-label="Добавить">+</button>
              </div>
            </div>
            <div className="field-help" style={{marginBottom: 10}}>Названия отраслей (кликните для изменения)</div>
            {sectors.map((s, i) => (
              <div key={s.id} className="sector-row" style={{padding: '4px 0'}}>
                <span className="sector-dot" style={{ background: s.color }}></span>
                <input
                  className="sector-name-input"
                  value={s.name}
                  onChange={(e) => updateSectorName(i, e.target.value)}
                  spellCheck={false}
                  placeholder={`Отрасль ${i+1}`}
                />
                <span></span>
              </div>
            ))}

            {/* === Аккордеон 1: Инвестиционное поведение === */}
            <div className={`accordion ${accordionsOpen.inv ? 'open' : ''}`}>
              <div className="accordion-head" onClick={() => toggleAcc('inv')}>
                <div className="left">
                  <span className="chev"></span>
                  <h3>Инвестиционное поведение</h3>
                </div>
              </div>
              {accordionsOpen.inv && (
                <div className="accordion-body">
                  <div className="field-help" style={{marginBottom: 10}}>
                    <span className="sym" style={{fontStyle:'italic',fontFamily:'"STIX Two Math", Times'}}>κ<span style={{fontSize:'0.72em',position:'relative',bottom:'-0.28em',marginLeft:'1px',color:'var(--ink-3)'}}>j</span></span> — норма реинвестирования,&nbsp;
                    <span className="sym" style={{fontStyle:'italic',fontFamily:'"STIX Two Math", Times'}}>η<span style={{fontSize:'0.72em',position:'relative',bottom:'-0.28em',marginLeft:'1px',color:'var(--ink-3)'}}>j</span></span> — восполнение дефицита мощностей
                  </div>
                  {sectors.map((s, i) => (
                    <div key={s.id} className="sector-block">
                      <div className="sector-block-head">
                        <span className="sector-dot" style={{background: s.color}}></span>
                        <span className="sector-block-name">{s.name}</span>
                      </div>
                      <div className="dual-sliders">
                        <div className="mini-slider">
                          <div className="mini-head">
                            <span className="mini-label"><span className="sym">κ<span className="sub">j</span></span><InfoTip text={INFO.kappa} /></span>
                            <span className="mini-val">{(params.kappa[i]*100).toFixed(0)}%</span>
                          </div>
                          <input type="range" min={0.01} max={0.60} step={0.01}
                            value={params.kappa[i] ?? 0.2}
                            onChange={(e) => updateArr('kappa', i, parseFloat(e.target.value))} />
                        </div>
                        <div className="mini-slider">
                          <div className="mini-head">
                            <span className="mini-label"><span className="sym">η<span className="sub">j</span></span><InfoTip text={INFO.eta} /></span>
                            <span className="mini-val">{(params.eta[i] ?? 0).toFixed(3)}</span>
                          </div>
                          <input type="range" min={0.001} max={0.050} step={0.001}
                            value={params.eta[i] ?? 0.010}
                            onChange={(e) => updateArr('eta', i, +parseFloat(e.target.value).toFixed(3))} />
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* === Аккордеон 2: Технологические инновации === */}
            <div className={`accordion ${accordionsOpen.tech ? 'open' : ''}`}>
              <div className="accordion-head" onClick={() => toggleAcc('tech')}>
                <div className="left">
                  <span className="chev"></span>
                  <h3>Технологические инновации</h3>
                </div>
              </div>
              {accordionsOpen.tech && (
                <div className="accordion-body">
                  <div className="field-help" style={{marginBottom: 10}}>
                    <span className="sym" style={{fontStyle:'italic',fontFamily:'"STIX Two Math", Times'}}>p<span style={{fontSize:'0.72em',position:'relative',bottom:'-0.28em',marginLeft:'1px',color:'var(--ink-3)'}}>inn,j</span></span> — вероятность инновации,&nbsp;
                    <span className="sym" style={{fontStyle:'italic',fontFamily:'"STIX Two Math", Times'}}>μ<span style={{fontSize:'0.72em',position:'relative',bottom:'-0.28em',marginLeft:'1px',color:'var(--ink-3)'}}>j</span></span> — средняя сила шока
                  </div>
                  {sectors.map((s, i) => (
                    <div key={s.id} className="sector-block">
                      <div className="sector-block-head">
                        <span className="sector-dot" style={{background: s.color}}></span>
                        <span className="sector-block-name">{s.name}</span>
                      </div>
                      <div className="dual-sliders">
                        <div className="mini-slider">
                          <div className="mini-head">
                            <span className="mini-label"><span className="sym">p<span className="sub">inn</span></span><InfoTip text={INFO.pInn} /></span>
                            <span className="mini-val">{((params.pInn[i] ?? 0)*100).toFixed(1)}%</span>
                          </div>
                          <input type="range" min={0.01} max={0.30} step={0.005}
                            value={params.pInn[i] ?? 0.10}
                            onChange={(e) => updateArr('pInn', i, +parseFloat(e.target.value).toFixed(3))} />
                        </div>
                        <div className="mini-slider">
                          <div className="mini-head">
                            <span className="mini-label"><span className="sym">μ<span className="sub">j</span></span><InfoTip text={INFO.mu} /></span>
                            <span className="mini-val">{(params.mu[i] ?? 0).toFixed(3)}</span>
                          </div>
                          <input type="range" min={0.005} max={0.060} step={0.001}
                            value={params.mu[i] ?? 0.022}
                            onChange={(e) => updateArr('mu', i, +parseFloat(e.target.value).toFixed(3))} />
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            {/* === Аккордеон 3: Структура агентов === */}
            <div className={`accordion ${accordionsOpen.agents ? 'open' : ''}`}>
              <div className="accordion-head" onClick={() => toggleAcc('agents')}>
                <div className="left">
                  <span className="chev"></span>
                  <h3>Структура агентов</h3>
                </div>
              </div>
              {accordionsOpen.agents && (
                <div className="accordion-body">
                  <div className="field-help" style={{marginBottom: 10, display: 'inline-flex', alignItems: 'baseline', gap: 4}}>
                    <span><span className="sym" style={{fontStyle:'italic',fontFamily:'"STIX Two Math", Times'}}>N<span style={{fontSize:'0.72em',position:'relative',bottom:'-0.28em',marginLeft:'1px',color:'var(--ink-3)'}}>j</span></span> — число фирм-агентов в отрасли (5–100)</span>
                    <InfoTip text={INFO.Nj} />
                  </div>
                  {sectors.map((s, i) => {
                    const v = params.Nj[i] ?? 20;
                    const err = v < 5 || v > 100;
                    return (
                      <div key={s.id} className="sector-block">
                        <div className="sector-block-head">
                          <span className="sector-dot" style={{background: s.color}}></span>
                          <span className="sector-block-name">{s.name}</span>
                          <input
                            type="number" min={5} max={100} step={1}
                            className={`int-input ${err ? 'err' : ''}`}
                            value={v}
                            onChange={(e) => {
                              const raw = e.target.value;
                              if (raw === '') { updateArr('Nj', i, ''); return; }
                              const n = parseInt(raw, 10);
                              if (!isNaN(n)) updateArr('Nj', i, Math.max(5, Math.min(100, n)));
                            }}
                            onBlur={(e) => {
                              const n = parseInt(e.target.value, 10);
                              if (isNaN(n)) updateArr('Nj', i, 20);
                              else updateArr('Nj', i, Math.max(5, Math.min(100, n)));
                            }}
                          />
                        </div>
                        <div className="hhi-hint">
                          мин. HHI = 1/N = {v >= 1 ? (1/v).toFixed(3) : '—'}
                        </div>
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          </div>

          <div className="sidebar-foot">
            {dirty && (
              <div className="dirty-indicator">
                <span className="dirty-dot"></span>
                <span>Параметры изменены — пересчитайте</span>
              </div>
            )}
            <button
              className={`run-btn ${dirty || isBaseline ? 'dirty' : ''}`}
              onClick={run}
              disabled={running}
            >
              {running ? (
                <><span className="spinner"></span><span>Расчёт…</span></>
              ) : (
                <span>Запустить симуляцию ↩</span>
              )}
            </button>
          </div>
        </aside>

        <main className="main">
          <div className="main-head">
            <h2 className="main-title">Результаты симуляции</h2>
            <div className="main-sub">
              {isBaseline
                ? <>Показан базовый сценарий. Задайте параметры и нажмите «Запустить».</>
                : <>Сценарий рассчитан · горизонт {appliedParams.T} лет · {2015}–{2015 + appliedParams.T}</>}
            </div>
            <div className="param-chips">
              <span className={`param-chip ${isBaseline ? 'muted' : ''}`}><span className="k">T</span><span className="eq">=</span><span className="v">{(appliedParams || params).T}</span></span>
              <span className={`param-chip ${isBaseline ? 'muted' : ''}`}><span className="k">g<span className="sub">U</span></span><span className="eq">=</span><span className="v">{((appliedParams || params).gU * 100).toFixed(1)}%</span></span>
              <span className={`param-chip ${isBaseline ? 'muted' : ''}`}><span className="k">σ<span className="sub">k</span></span><span className="eq">=</span><span className="v">{(appliedParams || params).sigmaK.toFixed(1)}</span></span>
              <span className={`param-chip ${isBaseline ? 'muted' : ''}`}><span className="k">B<span className="sub">clip</span></span><span className="eq">=</span><span className="v">{(appliedParams || params).bClip.toFixed(1)}</span></span>
              <span className={`param-chip ${isBaseline ? 'muted' : ''}`}><span className="k">N</span><span className="eq">=</span><span className="v">{displaySectors.length} отр.</span></span>
            </div>
          </div>

          <div className="charts">
            {chartConfigs.map((cfg, idx) => (
              <LineChart
                key={idx}
                {...cfg}
                xs={xs}
                xFmt={xFmt}
                placeholder={isBaseline}
                onExpand={() => setFullscreenIdx(idx)}
              />
            ))}
          </div>

          <div className="kpi-row">
            <div className={`kpi ${isBaseline ? 'muted' : ''}`}>
              <div className="k">Среднегодовой темп роста ВВП</div>
              <div className="v">
                {results ? `${results.kpi.cagr >= 0 ? '+' : ''}${results.kpi.cagr.toFixed(2)}` : '—'}
                <span style={{fontSize:14, color:'var(--ink-3)', fontWeight:400, marginLeft:4}}>%</span>
              </div>
              <div className="u">CAGR за {appliedParams ? appliedParams.T : params.T} лет</div>
            </div>
            <div className={`kpi ${isBaseline ? 'muted' : ''}`}>
              <div className="k">Финальный ВВП</div>
              <div className="v">
                {results ? results.kpi.finalGDP.toFixed(2) : '—'}
                <span style={{fontSize:14, color:'var(--ink-3)', fontWeight:400, marginLeft:4}}>трлн €</span>
              </div>
              <div className="u">в ценах базового года</div>
            </div>
            <div className={`kpi ${isBaseline ? 'muted' : ''}`}>
              <div className="k">Инвестиционные пульсы</div>
              <div className="v">{results ? results.kpi.pulses : '—'}</div>
              <div className="u">всего по {displaySectors.length} отраслям за период</div>
            </div>
            <div className={`kpi ${isBaseline ? 'muted' : ''}`}>
              <div className="k">Устойчивость системы</div>
              <div className="v" style={{fontSize: 16, fontWeight: 600, color: results && results.kpi.stable ? '#2c7a3b' : '#c0392b'}}>
                {results ? (results.kpi.stable ? '✓ ρ(A) < 1' : '✗ нарушена') : '—'}
              </div>
              <div className="u">на всём горизонте</div>
            </div>
          </div>
        </main>

        {fullscreenIdx !== null && (
          <div className="modal-backdrop" onClick={() => setFullscreenIdx(null)}>
            <div className="modal" onClick={(e) => e.stopPropagation()}>
              <div className="modal-head">
                <div>
                  <h3>{chartConfigs[fullscreenIdx].title}</h3>
                  <div className="sub">{chartConfigs[fullscreenIdx].subtitle}</div>
                </div>
                <button className="modal-close" onClick={() => setFullscreenIdx(null)} aria-label="Закрыть">✕</button>
              </div>
              <div className="modal-body">
                <LineChart
                  {...chartConfigs[fullscreenIdx]}
                  xs={xs}
                  xFmt={xFmt}
                  placeholder={isBaseline}
                  large
                />
              </div>
            </div>
          </div>
        )}
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
